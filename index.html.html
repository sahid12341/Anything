<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>S.Z. Dairy Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --surface:#141210; --surface2:#1C1916; --surface3:#242019;
    --border:#3A331F; --hair:#2A2419;
    --gold:#D4AF37; --gold2:#F0D584; --gold3:#9C7A22;
    --text:#F5F0E6; --muted:#A69A82; --muted2:#6E6551;
    --danger:#C0574B; --ok:#6FA07E;
    --gradient-gold: linear-gradient(135deg, #F0D584 0%, #D4AF37 45%, #B8860B 100%);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:radial-gradient(ellipse 900px 500px at 50% -10%, #1E1A12 0%, #000000 60%) fixed, #000;
    color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .serif{ font-family:'Cormorant Garamond', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  ::placeholder{ color:var(--muted2); }
  button, input, select, textarea{ font-family:inherit; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .hero, .stat-card, .catalog-card, .alert-row, .record-card{ animation:fadeInUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .stat-card, .catalog-card, .alert-row, .record-card, .data-btn, .m-save, .m-cancel, #tb-add{
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .stat-card:active, .catalog-card:active, .alert-row:active, .record-card:active, .data-btn:active{ transform:scale(.97); }

  #topbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--hair); }
  #tb-left{ display:flex; align-items:center; gap:4px; min-width:44px; }
  #back-btn{ background:none; border:none; color:var(--gold); font-size:15px; cursor:pointer; padding:4px 2px;
    display:none; align-items:center; gap:3px; font-weight:600; }
  #tb-title{ font-size:20px; font-weight:600; letter-spacing:.02em; flex:1; text-align:center; }
  #tb-title .light{ color:var(--muted); font-weight:400; }
  #tb-right{ min-width:44px; display:flex; justify-content:flex-end; }
  #tb-add{ background:none; border:1px solid var(--gold3); color:var(--gold2); font-size:12px; font-weight:700;
    cursor:pointer; padding:6px 12px; border-radius:3px; display:none; text-transform:uppercase; letter-spacing:.08em; }

  #content{ padding:0 0 60px; max-width:720px; margin:0 auto; }

  /* Hero */
  .hero{ text-align:center; padding:40px 20px 34px; position:relative; }
  .hero::before{ content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:200px; height:200px;
    background:radial-gradient(circle, rgba(212,175,55,.14) 0%, transparent 70%); pointer-events:none; }
  .hero::after{ content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:120px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold3), transparent); }
  .hero-badge{ width:88px; height:88px; border-radius:50%; margin:0 auto 18px; overflow:hidden; position:relative;
    border:1.5px solid var(--gold3); box-shadow:0 0 0 5px rgba(0,0,0,.9), 0 0 0 6px rgba(212,175,55,.25), 0 20px 40px rgba(0,0,0,.6); }
  .hero-badge img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero h1{ font-size:38px; font-weight:600; margin:0; letter-spacing:.01em; }
  .hero .tagline{ color:var(--muted); font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; margin-top:8px; }
  .hero .est{ color:var(--gold3); font-size:11px; letter-spacing:.15em; margin-top:14px; }

  .eyebrow{ color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    padding:0 20px; margin-bottom:2px; display:flex; align-items:center; gap:10px; }
  .eyebrow::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--hair), transparent); }
  .eyebrow:not(:first-of-type){ margin-top:8px; }
  .section-title{ font-size:22px; font-weight:600; padding:0 20px; margin:0 0 16px; }

  /* Editorial stat grid */
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--hair);
    margin:0 20px 34px; border:1px solid var(--hair); border-radius:8px; overflow:hidden; }
  .stat-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); padding:20px 18px;
    cursor:pointer; position:relative; box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03); }
  .stat-card::before{ content:""; position:absolute; top:0; left:0; width:26px; height:2px; background:var(--gradient-gold); }
  .stat-card .s-label{ color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
  .stat-card .s-value{ font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; color:var(--gold2);
    margin-top:8px; line-height:1; }
  .stat-card .s-sub{ color:var(--muted2); font-size:11px; margin-top:5px; }

  /* Alert strip */
  .alert-strip{ margin:0 20px 34px; }
  .alert-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--surface);
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    border:1px solid var(--hair); border-left:2px solid var(--gold3); border-radius:6px; margin-bottom:8px; cursor:pointer; }
  .alert-row .a-text{ flex:1; font-size:13.5px; color:var(--text); }
  .alert-row .a-count{ background:var(--gradient-gold); color:#141108; font-size:11px; font-weight:800;
    padding:3px 9px; border-radius:999px; }
  .alert-row .a-chev{ color:var(--gold3); }

  /* Catalog grid (editorial cards) */
  .catalog-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:0 20px; }
  .catalog-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid var(--hair);
    border-radius:10px; padding:18px 16px; cursor:pointer; position:relative; overflow:hidden; text-align:left;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03); }
  .catalog-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--gradient-gold); }
  .catalog-card:nth-child(3n+2)::before{ opacity:.75; }
  .catalog-card:nth-child(3n+3)::before{ opacity:.55; }
  .catalog-card:active{ border-color:var(--gold3); box-shadow:0 4px 14px rgba(0,0,0,.35), 0 0 0 1px rgba(212,175,55,.3); }
  .catalog-card .c-index{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold3); letter-spacing:.05em; }
  .catalog-card .c-name{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin-top:6px; }
  .catalog-card .c-sub{ color:var(--muted); font-size:10.5px; margin-top:2px; letter-spacing:.02em; }
  .catalog-card .c-count{ margin-top:14px; color:var(--gold2); font-size:12px; font-weight:600; }

  .data-row{ display:flex; gap:12px; margin:24px 20px 0; }
  .data-btn{ flex:1; background:var(--surface); border:1px solid var(--hair); color:var(--text); border-radius:8px;
    padding:14px; cursor:pointer; font-size:12.5px; font-weight:600; letter-spacing:.02em; }
  .data-btn .dg{ color:var(--gold2); }
  .footnote{ color:var(--muted2); font-size:11.5px; padding:16px 20px 0; line-height:1.7; text-align:center; }
  .footnote b{ color:var(--gold3); }

  /* Module list header */
  .module-hero{ padding:28px 20px 20px; text-align:center; }
  .module-hero .m-eyebrow{ color:var(--gold); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; }
  .module-hero h1{ font-size:34px; font-weight:600; margin:6px 0 0; }
  .module-hero .m-rule{ width:60px; height:1px; background:linear-gradient(90deg, transparent, var(--gold3), transparent);
    margin:14px auto 0; }

  .search-wrap{ padding:0 20px 18px; }
  .search-wrap input{ width:100%; background:var(--surface); border:1px solid var(--hair); border-radius:8px;
    color:var(--text); padding:12px 16px; font-size:14.5px; outline:none; }
  .search-wrap input:focus{ border-color:var(--gold3); }

  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 16px; -webkit-overflow-scrolling:touch; }
  .filter-chip{ flex-shrink:0; background:var(--surface); border:1px solid var(--hair); color:var(--muted);
    border-radius:999px; padding:7px 15px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .filter-chip.active{ background:var(--gradient-gold); color:#141108; border-color:transparent; }

  .empty-note{ margin:0 20px; background:var(--surface); border:1px dashed var(--hair); border-radius:10px;
    padding:52px 20px; text-align:center; color:var(--muted); font-size:13.5px; }

  .record-list{ padding:0 20px; display:grid; gap:12px; }
  .record-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid var(--hair);
    border-radius:10px; padding:16px; box-shadow:0 3px 10px rgba(0,0,0,.3);
    display:flex; gap:14px; align-items:flex-start; }
  .rc-photo{ width:60px; height:60px; flex-shrink:0; border-radius:8px; overflow:hidden; border:1px solid var(--gold3);
    display:flex; align-items:center; justify-content:center; background:var(--surface3); }
  .rc-photo img{ width:100%; height:100%; object-fit:cover; cursor:pointer; }
  .rc-photo span{ font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--gold3); }
  .rc-body{ flex:1; min-width:0; }
  .rc-id{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; color:var(--gold2); }
  .rc-fields{ display:flex; flex-wrap:wrap; gap:2px 16px; margin-top:5px; }
  .rc-fields .f-label{ color:var(--muted2); font-size:10.5px; font-weight:600; }
  .rc-fields .f-val{ color:var(--text); font-size:13px; font-weight:500; }
  .more-photos{ color:var(--muted2); font-size:11px; margin-top:4px; width:100%; }
  .rc-actions{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  .rc-actions button{ background:none; border:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;
    letter-spacing:.03em; }
  .rc-actions button:hover{ color:var(--gold2); }
  .rc-actions button.del:hover{ color:var(--danger); }

  /* Modal */
  #modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0); z-index:100; display:flex;
    align-items:flex-end; justify-content:center; pointer-events:none; transition:background .25s ease; }
  #modal-backdrop.open{ background:rgba(0,0,0,.7); pointer-events:auto; }
  #modal{ background:#0A0806; width:100%; max-width:720px; max-height:92vh; overflow-y:auto;
    border-radius:16px 16px 0 0; border-top:1px solid var(--gold3); transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  #modal-backdrop.open #modal{ transform:translateY(0); }
  #modal .modal-topbar{ position:sticky; top:0; background:#0A0806; display:flex; align-items:center;
    justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--hair); }
  #modal .modal-topbar .m-title{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
  #modal .modal-topbar button{ background:none; border:none; font-size:14px; cursor:pointer; padding:4px; font-weight:600; }
  #modal .m-cancel{ color:var(--muted); }
  #modal .m-save{ color:#0A0806; background:var(--gradient-gold); font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; font-size:12px; padding:9px 18px; border-radius:6px; }
  #modal-fields{ padding:20px; }

  .field-row{ margin-bottom:16px; }
  .field-row label{ display:block; font-size:11px; color:var(--gold3); margin-bottom:6px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; }
  .field-row input, .field-row select, .field-row textarea{ width:100%; background:var(--surface); border:1px solid var(--hair);
    border-radius:8px; color:var(--text); padding:11px 13px; font-size:14.5px; outline:none; font-family:'Inter',sans-serif; }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus{ border-color:var(--gold3); }
  .field-row textarea{ resize:vertical; }
  .field-row select option{ background:var(--surface); }

  .photo-section-label{ color:var(--gold3); font-size:11px; margin:0 0 8px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
  .photo-thumb{ position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--gold3); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; }
  .photo-thumb .rm{ position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; border:none;
    border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:11px; line-height:1; }
  .photo-add{ width:72px; height:72px; border-radius:8px; border:1px dashed var(--gold3); background:var(--surface);
    color:var(--gold2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:300; }

  #lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:200; display:none; align-items:center;
    justify-content:center; padding:20px; }
  #lightbox.open{ display:flex; }
  #lightbox .imgs{ display:flex; gap:10px; flex-wrap:wrap; max-width:700px; }
  #lightbox img{ max-height:70vh; max-width:100%; border-radius:10px; border:1px solid var(--gold3); }

  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:300;
    background:#171310; border:1px solid var(--gold3); color:var(--text); padding:12px 20px; border-radius:999px;
    font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; display:flex; align-items:center; gap:8px; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex-shrink:0; }

  @media print{
    #topbar, .data-row, .footnote, button{ display:none !important; }
    body{ background:#fff; color:#000; }
    .stat-card, .record-card{ background:#fff; border:1px solid #999; }
    .s-value, .rc-id{ color:#000 !important; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="tb-left"><button id="back-btn">‹ Back</button></div>
  <div id="tb-title" class="serif">S.Z. <span class="light">Dairy Farm</span></div>
  <div id="tb-right"><button id="tb-add">+ Add</button></div>
</div>

<div id="content"></div>

<div id="modal-backdrop"><div id="modal"></div></div>
<div id="lightbox"><div class="imgs"></div></div>
<div id="toast"><span class="dot"></span><span id="toast-text"></span></div>

/* ============================== HELPERS ============================== */
function esc(s){ if(s===undefined||s===null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function moduleById(id){ return MODULES.find(m=>m.id===id); }

function loadAll(){
  MODULES.forEach(m=>{
    try{ const raw = localStorage.getItem("sz_"+m.id); DATA[m.id] = raw ? JSON.parse(raw) : []; }
    catch(e){ DATA[m.id] = []; }
  });
}
function saveModule(moduleId){
  try{ localStorage.setItem("sz_"+moduleId, JSON.stringify(DATA[moduleId] || [])); return true; }
  catch(e){ alert("Could not save — storage may be full. Back up, then remove some old photos/records."); return false; }
}
function storageUsedKB(){
  let total = 0;
  MODULES.forEach(m=>{ const v = localStorage.getItem("sz_"+m.id); if(v) total += v.length; });
  return Math.round(total/1024);
}
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.55;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toast-text").textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

function calcAge(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr);
  if(isNaN(dob.getTime())) return null;
  const now = new Date();
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  if(now.getDate() < dob.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  if(years<=0) return months+" mo";
  return years+"y "+months+"mo";
}

function renderHome(){
  const animals = DATA.animals || [];
  const activeAnimals = animals.filter(a=> a.status==="Active" || !a.status);
  const herdCounts = {};
  activeAnimals.forEach(a=>{ const t = a.animalType||"Unspecified"; herdCounts[t] = (herdCounts[t]||0)+1; });
  const herdBreakdown = Object.entries(herdCounts).map(([t,c])=>c+" "+t).join(" · ") || "No animals yet";
  const thisMonth = new Date().toISOString().slice(0,7);
  const purchasesThisMonth = (DATA.purchases||[]).filter(p=>(p.date||"").startsWith(thisMonth));
  const salesThisMonth = (DATA.sales||[]).filter(s=>(s.date||"").startsWith(thisMonth));
  const purchaseTotal = purchasesThisMonth.reduce((s,p)=>s+(Number(p.price)||0),0);
  const saleTotal = salesThisMonth.reduce((s,p)=>s+(Number(p.price)||0),0);
  const lowMed = (DATA.medStock||[]).filter(m=>Number(m.quantity) <= Number(m.lowStockThreshold||0));
  const lowFeed = (DATA.feedStock||[]).filter(f=>Number(f.quantity) <= Number(f.lowStockThreshold||0));
  const today = new Date(); const in30 = new Date(); in30.setDate(today.getDate()+30);
  const upcomingCalvings = (DATA.breeding||[]).filter(b=>{
    if(!b.expectedCalvingDate) return false;
    const d = new Date(b.expectedCalvingDate);
    return d>=today && d<=in30 && b.status!=="Failed";
  });
  const pendingSalary = (DATA.salary||[]).filter(s=>s.status==="Pending");
  const activeEmployees = (DATA.employees||[]).filter(e=>e.status==="Active" || !e.status);

  // Milk production
  const todayStr = new Date().toISOString().slice(0,10);
  const milkToday = (DATA.milk||[]).filter(m=>m.date===todayStr).reduce((s,m)=>s+(Number(m.quantity)||0),0);
  const milkThisMonth = (DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).reduce((s,m)=>s+(Number(m.quantity)||0),0);
  const milkDaysThisMonth = new Set((DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).map(m=>m.date)).size || 1;
  const milkAvgPerDay = milkThisMonth / milkDaysThisMonth;

  const milkByAnimalThisMonth = {};
  (DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).forEach(m=>{
    const tag = m.animalTag || "Unknown";
    milkByAnimalThisMonth[tag] = (milkByAnimalThisMonth[tag]||0) + (Number(m.quantity)||0);
  });
  let topProducer = null, topProducerAmt = 0;
  Object.entries(milkByAnimalThisMonth).forEach(([tag,amt])=>{ if(amt>topProducerAmt){ topProducer=tag; topProducerAmt=amt; } });

  // Recent activity across all modules
  let recentActivity = [];
  MODULES.forEach(m=>{
    (DATA[m.id]||[]).forEach(r=>{
      recentActivity.push({ moduleId:m.id, moduleLabel:m.label, primary:r[m.fields[0].key]||"—", createdAt:r.createdAt||"" });
    });
  });
  recentActivity.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  recentActivity = recentActivity.slice(0,6);
  function timeAgo(iso){
    if(!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins<1) return "just now";
    if(mins<60) return mins+"m ago";
    const hrs = Math.floor(mins/60);
    if(hrs<24) return hrs+"h ago";
    const days = Math.floor(hrs/24);
    if(days<30) return days+"d ago";
    return new Date(iso).toISOString().slice(0,10);

  pendingSalary.forEach(s=> alertsHtml += alertRow(`Salary pending — ${s.employeeName} (${s.month||""})`, {mid:"salary"}));

    </div>` : ""}

    <div class="eyebrow">All-Time Financials</div>
    <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat-card"><div class="s-label">Total Revenue</div><div class="s-value">₹${totalSalesRevenue.toLocaleString("en-IN")}</div><div class="s-sub">From animal sales</div></div>
      <div class="stat-card"><div class="s-label">Total Expenses</div><div class="s-value">₹${totalExpenses.toLocaleString("en-IN")}</div><div class="s-sub">Purchases, transport, medical, feed, salary</div></div>
      <div class="stat-card" style="grid-column:span 2;"><div class="s-label">Net Position</div><div class="s-value" style="color:${netPosition>=0 ? 'var(--gold2)' : 'var(--danger)'};">${netPosition>=0?"₹":"-₹"}${Math.abs(netPosition).toLocaleString("en-IN")}</div><div class="s-sub">Revenue minus all recorded expenses, all-time</div></div>
    </div>

    <div class="eyebrow">The Register</div>
    <div class="section-title serif">Records &amp; Ledgers</div>
    <div class="catalog-grid">
      ${MODULES.map((m,i)=>`
        <button class="catalog-card" data-goto="${m.id}">
          <div class="c-index">${String(i+1).padStart(2,'0')}</div>
          <div class="c-name serif">${esc(m.label)}</div>
          <div class="c-sub">${esc(m.subtitle)}</div>
          <div class="c-count">${(DATA[m.id]||[]).length} entries</div>
        </button>`).join("")}
      <button class="catalog-card" data-goto="gallery">
        <div class="c-index">★</div>
        <div class="c-name serif">Gallery</div>
        <div class="c-sub">Visual Index</div>
        <div class="c-count">${totalPhotoCount} photos</div>
      </button>
    </div>

    <div class="data-row">
      <button class="data-btn" id="row-export"><span class="dg">⬇</span> Backup Data</button>
      <button class="data-btn" id="row-import"><span class="dg">⬆</span> Restore Data</button>
    </div>
    <div class="footnote"><b>Data lives only on this device</b> — nothing is uploaded anywhere. Back up regularly to a file on your phone. Local storage used: ${storageUsedKB()} KB.</div>
    <input type="file" id="file-import" accept="application/json" style="display:none" />
    </div>
  `;

  document.getElementById("global-search").addEventListener("input", (e)=>{
    SEARCH.global = e.target.value;
    renderGlobalSearch();
  });
  renderGlobalSearch();

  document.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=> goTo(el.getAttribute("data-goto")));
  });
  document.getElementById("row-export").addEventListener("click", handleExport);
  document.getElementById("row-import").addEventListener("click", ()=> document.getElementById("file-import").click());
  document.getElementById("file-import").addEventListener("change",(e)=>{
    if(e.target.files && e.target.files[0]) handleImport(e.target.files[0]);
  });
}

function renderGlobalSearch(){
  const query = (SEARCH.global||"").trim().toLowerCase();
  const resultsEl = document.getElementById("search-results");
  const normalEl = document.getElementById("normal-home");
  if(!query){
    resultsEl.innerHTML = "";
    normalEl.style.display = "";
    return;
  }
  normalEl.style.display = "none";
  let resultsHtml = "";
  let totalMatches = 0;
  MODULES.forEach(m=>{
    const matches = (DATA[m.id]||[]).filter(r=>
      Object.values(r).some(v=> typeof v==="string" && v.toLowerCase().includes(query))
    );
    if(matches.length){
      totalMatches += matches.length;
      const idKey = m.fields[0].key;
      const rows = matches.slice(0,8).map(r=>`
        <div class="record-card" data-searchgoto="${m.id}" data-searchtag="${esc(r[idKey]||'')}">
          <div class="rc-body"><div class="rc-id">${esc(r[idKey]||"—")}</div>
          <div class="rc-fields"><div class="f-val">${esc(m.label)}</div></div></div>
        </div>`).join("");
      resultsHtml += `<div class="eyebrow">${esc(m.label)} (${matches.length})</div><div class="record-list" style="margin-bottom:24px;">${rows}</div>`;
    }
  });
  resultsEl.innerHTML = totalMatches===0
    ? `<div class="empty-note" style="margin:0 20px;">No matches for "${esc(SEARCH.global)}".</div>`
    : resultsHtml;
  resultsEl.querySelectorAll("[data-searchgoto]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const mid = el.getAttribute("data-searchgoto");
      if(mid==="animals"){ goTo("profile::"+el.getAttribute("data-searchtag")); return; }
      SEARCH[mid] = SEARCH.global;
      goTo(mid);
    });
  });
}

/* ============================== MODULE LIST ============================== */
function renderModuleList(moduleId){
  const mod = moduleById(moduleId);
  const records = DATA[moduleId] || [];
  const query = (SEARCH[moduleId] || "").toLowerCase();
  const filterField = mod.fields.find(f=> f.key==="status" || f.key==="paymentStatus");
  const activeFilter = FILTERS[moduleId] || "";
  let sorted = [...records].sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
  if(filterField && activeFilter){
    sorted = sorted.filter(r=> (r[filterField.key]||"") === activeFilter);
  }
  if(query.trim()){
    sorted = sorted.filter(r => Object.values(r).some(v => typeof v==="string" && v.toLowerCase().includes(query)));
  }
  const idField = mod.fields[0];
  const secondaryFields = mod.fields.slice(1,3);

  let rowsHtml = "";
  if(sorted.length===0){
    rowsHtml = `<div class="empty-note">No ${esc(mod.label.toLowerCase())} records yet.<br/>Tap "+ Add" above to create one.</div>`;
  } else {
    rowsHtml = `<div class="record-list">` + sorted.map(r=>{
      const photo = (r.photos && r.photos[0])
        ? `<img src="${r.photos[0]}" data-lightbox="${r.id}" />`
        : `<span>${esc(mod.label.charAt(0))}</span>`;
      const secondaryText = secondaryFields.map(f=> r[f.key] ? esc(r[f.key]) : "").filter(Boolean);
      const fieldsHtml = secondaryFields.map((f,i)=> secondaryText[i] ? `<div><span class="f-label">${esc(f.label)}: </span><span class="f-val">${secondaryText[i]}</span></div>` : "").join("");
      const morePhotos = (r.photos && r.photos.length>1) ? `<div class="more-photos">+${r.photos.length-1} more photo${r.photos.length-1>1?"s":""}</div>` : "";
      return `
        <div class="record-card">
          <div class="rc-photo">${photo}</div>
          <div class="rc-body">
            <div class="rc-id">${esc(r[idField.key] || "—")}</div>
            <div class="rc-fields">${fieldsHtml}${morePhotos}</div>
          </div>
          <div class="rc-actions">
            ${moduleId==="animals" ? `<button data-profile="${r.id}">Profile</button>` : ""}
            <button data-edit="${r.id}">Edit</button>
            <button data-del="${r.id}" class="del">Delete</button>
          </div>
        </div>`;
    }).join("") + `</div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="module-hero">
      <div class="m-eyebrow">${esc(mod.subtitle)}</div>
      <h1 class="serif">${esc(mod.label)}</h1>
      <div class="m-rule"></div>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="Search ${esc(mod.label.toLowerCase())}..." id="search-input" value="${esc(SEARCH[moduleId]||'')}" />
      <button id="btn-export-csv" style="margin-top:10px;background:none;border:1px solid var(--hair);color:var(--gold2);
        border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.03em;">⬇ Export as CSV</button>
    </div>
    ${filterField ? `<div class="filter-row">
      <button class="filter-chip ${!activeFilter?'active':''}" data-filter="">All</button>
      ${filterField.options.map(o=>`<button class="filter-chip ${activeFilter===o?'active':''}" data-filter="${esc(o)}">${esc(o)}</button>`).join("")}
    </div>` : ""}
    ${rowsHtml}
  `;

  document.getElementById("search-input").addEventListener("input", (e)=>{
    SEARCH[moduleId] = e.target.value;
    renderModuleList(moduleId);
  });
  document.getElementById("btn-export-csv").addEventListener("click", ()=> exportModuleCSV(moduleId));
  document.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{
      FILTERS[moduleId] = el.getAttribute("data-filter");
      renderModuleList(moduleId);
    });
  });
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const rec = records.find(r=>r.id===el.getAttribute("data-edit"));
      openModal(moduleId, rec);
    });
  });
  document.querySelectorAll("[data-profile]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const rec = records.find(r=>r.id===el.getAttribute("data-profile"));
      goTo("profile::"+rec.tagId);
    });
  });
  document.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(confirm("Delete this record?")){
        DATA[moduleId] = DATA[moduleId].filter(r=>r.id!==el.getAttribute("data-del"));
        saveModule(moduleId);
        renderModuleList(moduleId);
        showToast("Record deleted");
      }
    });
  });
  document.querySelectorAll("[data-lightbox]").forEach(img=>{
    img.addEventListener("click", ()=>{
      const rec = records.find(r=>r.id===img.getAttribute("data-lightbox"));
      openLightbox(rec.photos || []);
    });
  });
}

function openLightbox(photos){
  const lb = document.getElementById("lightbox");
  lb.querySelector(".imgs").innerHTML = photos.map(p=>`<img src="${p}" />`).join("");
  lb.classList.add("open");
}
document.getElementById("lightbox").addEventListener("click", ()=> document.getElementById("lightbox").classList.remove("open"));

/* ============================== MODAL (ADD/EDIT) ============================== */
let MODAL_PHOTOS = [];
function openModal(moduleId, record){
  const mod = moduleById(moduleId);
  MODAL_PHOTOS = record ? (record.photos || []).slice() : [];

  const todayISO = new Date().toISOString().slice(0,10);
  const noAutoDateFields = new Set(["dob","expectedCalvingDate","followUpDate","expiryDate","joinDate","dueDate"]);
  const fieldsHtml = mod.fields.map(f=>{
    const val = record ? (record[f.key]||"") : (f.type==="date" && !noAutoDateFields.has(f.key) ? todayISO : "");
    let inputHtml;
    if(f.type==="textarea"){
      inputHtml = `<textarea rows="2" data-field="${f.key}">${esc(val)}</textarea>`;
    } else if(f.type==="select"){
      const opts = `<option value="">Select...</option>` + f.options.map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("");
      inputHtml = `<select data-field="${f.key}">${opts}</select>`;
    } else if(f.type==="tagRef"){
      inputHtml = `<input type="text" list="animal-tags-list" data-field="${f.key}" value="${esc(val)}" placeholder="Type a name, or pick a registered animal" />`;
    } else if(f.type==="employeeRef"){
      inputHtml = `<input type="text" list="employee-names-list" data-field="${f.key}" value="${esc(val)}" placeholder="Type or pick an employee" />`;
    } else {
      inputHtml = `<input type="${f.type}" data-field="${f.key}" value="${esc(val)}" />`;
    }
    return `<div class="field-row"><label>${esc(f.label)}${f.required?" *":""}</label>${inputHtml}</div>`;
  }).join("");

  const animalOptions = (DATA.animals||[]).map(a=>`<option value="${esc(a.tagId)}">`).join("");
  const employeeOptions = (DATA.employees||[]).map(e=>`<option value="${esc(e.name)}">`).join("");

  document.getElementById("modal").innerHTML = `
    <div class="modal-topbar">
      <button class="m-cancel" id="modal-cancel">Cancel</button>
      <div class="m-title">${record?"Edit":"New"} ${esc(mod.label)}</div>
      <button class="m-save" id="modal-save">Save</button>
    </div>
    <div id="modal-fields">
      ${fieldsHtml}
      <div class="photo-section-label">Photos (<span id="photo-count">${MODAL_PHOTOS.length}</span>)</div>
      <div class="photo-grid" id="photo-grid"></div>
      <input type="file" id="photo-input" accept="image/*" multiple style="display:none" />
    </div>
    <datalist id="animal-tags-list">${animalOptions}</datalist>
    <datalist id="employee-names-list">${employeeOptions}</datalist>
  `;
  renderPhotoGrid();
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", ()=> saveModal(moduleId, record));
  document.getElementById("modal-backdrop").classList.add("open");
}
function renderPhotoGrid(){
  const grid = document.getElementById("photo-grid");
  let html = MODAL_PHOTOS.map((p,i)=>`
    <div class="photo-thumb"><img src="${p}" /><button class="rm" data-rmphoto="${i}">×</button></div>
  `).join("");
  html += `<button class="photo-add" id="photo-add-btn">+</button>`;
  grid.innerHTML = html;
  document.getElementById("photo-count").textContent = MODAL_PHOTOS.length;
  document.getElementById("photo-add-btn").addEventListener("click", ()=> document.getElementById("photo-input").click());
  grid.querySelectorAll("[data-rmphoto]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      MODAL_PHOTOS.splice(Number(btn.getAttribute("data-rmphoto")),1);
      renderPhotoGrid();
    });
  });
  document.getElementById("photo-input").onchange = async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      try{ const dataUrl = await compressImage(file); MODAL_PHOTOS.push(dataUrl); }catch(err){}
    }
    renderPhotoGrid();
  };
}
function closeModal(){ document.getElementById("modal-backdrop").classList.remove("open"); }
function saveModal(moduleId, record){
  const mod = moduleById(moduleId);
  const form = {};
  let missingField = null;
  mod.fields.forEach(f=>{
    const el = document.querySelector(`[data-field="${f.key}"]`);
    form[f.key] = el ? el.value : "";
    if(f.required && !form[f.key]) missingField = f.label;
  });
  if(missingField){ alert(missingField + " is required."); return; }

  if(moduleId === "animals" && !record){
    const dup = (DATA.animals||[]).find(a=> (a.tagId||"").trim().toLowerCase() === (form.tagId||"").trim().toLowerCase());
    if(dup){
      const proceed = confirm(`An animal named "${form.tagId}" already exists (${dup.animalType||"animal"}, ${dup.breed||""}). Save this as a separate animal anyway?`);
      if(!proceed) return;
    }
  }

  if(moduleId === "breeding" && !form.expectedCalvingDate && form.date && form.femaleTag){
    const animal = (DATA.animals||[]).find(a=>a.tagId===form.femaleTag);
    const gestationDays = (animal && animal.animalType === "Buffalo") ? 310 : 283;
    const serviceDate = new Date(form.date);
    if(!isNaN(serviceDate.getTime())){
      const due = new Date(serviceDate.getTime() + gestationDays*24*60*60*1000);
      form.expectedCalvingDate = due.toISOString().slice(0,10);
    }
  }

  if(moduleId === "sales" && form.animalTag){
    const animalIdx = (DATA.animals||[]).findIndex(a=>a.tagId===form.animalTag);
    if(animalIdx>=0 && DATA.animals[animalIdx].status !== "Sold"){
      DATA.animals[animalIdx].status = "Sold";
      saveModule("animals");
    }
  }

  const rec = { id: record ? record.id : uid(), createdAt: record ? record.createdAt : new Date().toISOString(), ...form, photos: MODAL_PHOTOS.slice() };
  if(!DATA[moduleId]) DATA[moduleId] = [];
  if(record){ DATA[moduleId] = DATA[moduleId].map(r=> r.id===rec.id ? rec : r); }
  else { DATA[moduleId].push(rec); }
  saveModule(moduleId);
  closeModal();
  render();
  showToast(record ? "Changes saved" : "Entry added");
}

/* ============================== BACKUP / RESTORE ============================== */
function csvEscape(val){
  if(val===undefined||val===null) return "";
  const s = String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportModuleCSV(moduleId){
  const mod = moduleById(moduleId);
  const records = DATA[moduleId] || [];
  if(records.length===0){ alert("No records to export yet."); return; }
  const headers = mod.fields.map(f=>f.label);
  const keys = mod.fields.map(f=>f.key);
  let csv = headers.map(csvEscape).join(",") + "\n";
  const sorted = [...records].sort((a,b)=> (a.createdAt||"").localeCompare(b.createdAt||""));
  sorted.forEach(r=>{
    csv += keys.map(k=>csvEscape(r[k])).join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sz-" + moduleId + "-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("CSV downloaded");
}

function handleExport(){
  const payload = { exportedAt: new Date().toISOString(), data: DATA };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sz-dairy-farm-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup downloaded");
}
function handleImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed;
      if(!confirm("This will replace your current data with the backup file. Continue?")) return;
      MODULES.forEach(m=>{ DATA[m.id] = incoming[m.id] || []; saveModule(m.id); });
      render();
      showToast("Backup restored");
    }catch(err){ alert("Could not read that file — make sure it's a valid S.Z. Dairy Farm backup."); }
  };
  reader.readAsText(file);
}

/* ============================== INIT ============================== */
loadAll();
render();
</script>
